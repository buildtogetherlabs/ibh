<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>International Brotherhood of Hoodsters - Local 4663</title>
    <link rel="icon" href="HoodstersLogoWhite.png" type="image/png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Roboto Mono', monospace;
        }

        .jacket {
            max-width: min(420px, 70vw);
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.3s ease;
            user-select: none;
        }

        .jacket:hover {
            transform: scale(1.03);
        }

        .cta-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 32px;
            padding: 0 16px;
        }

        a.join {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #8b0000;
            color: #d4af37;
            padding: 16px 32px;
            font-size: 18px;
            font-family: 'Roboto Mono', monospace;
            letter-spacing: 0.04em;
            border: none;
            cursor: pointer;
            transition: background 0.2s ease;
            min-width: 240px;
            text-decoration: none;
            text-align: center;
        }

        a.join:hover,
        a.join:focus-visible {
            background: #a00000;
            outline: none;
        }

        a.x-link {
            position: fixed;
            right: 24px;
            bottom: 24px;
            font-family: 'Roboto Mono', monospace;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: #8b0000;
            text-decoration: none;
            line-height: 1;
            z-index: 2;
            transition: color 0.2s ease;
        }

        a.x-link:hover,
        a.x-link:focus-visible {
            color: #a00000;
            outline: none;
        }
    </style>
</head>
<body>
    <img src="IBHjacket-20260721b.png" class="jacket" alt="Union Jacket">

    <!-- Presale: join → pledge; hall → books status -->
    <div class="cta-row">
        <a class="join" href="/pledge/">JOIN LOCAL 4663</a>
        <a class="join" href="/books/">ENTER UNION HALL</a>
    </div>

    <a
        class="x-link"
        href="https://x.com/local4663"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Local 4663 on X"
    >X</a>
</body>
</html>
