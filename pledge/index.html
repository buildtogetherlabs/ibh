<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Pledge — Local 4663</title>
    <link rel="icon" href="HoodstersLogoWhite.png" type="image/png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap');

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            min-height: 100vh;
        }

        body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Roboto Mono', monospace;
        }

        .back {
            position: fixed;
            top: 24px;
            left: 24px;
            color: #8b0000;
            font-size: 14px;
            text-decoration: none;
            opacity: 0.85;
            z-index: 2;
        }

        .back:hover {
            opacity: 1;
        }

        .panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: min(440px, 100%);
            width: 100%;
        }

        .member-card {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
            background: transparent;
            /* White PNG canvas multiplies to invisible on white page — no rectangular outline */
            mix-blend-mode: multiply;
        }

        button.cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 24px;
            background: #8b0000;
            color: #d4af37;
            padding: 16px 48px;
            font-size: 20px;
            font-family: 'Roboto Mono', monospace;
            letter-spacing: 0.04em;
            border: none;
            cursor: pointer;
            transition: background 0.2s ease;
            min-width: 280px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        button.cta:hover,
        button.cta:focus-visible {
            background: #a00000;
            outline: none;
        }

        button.cta .label-copied {
            display: none;
        }

        button.cta.is-copied .label-default {
            display: none;
        }

        button.cta.is-copied .label-copied {
            display: inline;
        }

        .wallet-hint {
            display: none;
            margin: 12px 0 0;
            max-width: 360px;
            width: 100%;
            color: #5c4a2a;
            font-size: 12px;
            line-height: 1.4;
            text-align: center;
            word-break: break-all;
        }

        .wallet-hint.is-visible {
            display: block;
        }
    </style>
</head>
<body>
    <a class="back" href="/">← LOCAL 4663</a>

    <div class="panel">
        <img
            src="IBHmembercard.png?v=multiply"
            class="member-card"
            alt="International Brotherhood of Hoodsters membership card"
        >

        <button type="button" class="cta" id="pledge-btn" aria-label="Send Pledge — copy wallet address">
            <span class="label-default">SEND PLEDGE</span>
            <span class="label-copied">COPIED</span>
        </button>
        <p class="wallet-hint" id="wallet-hint" aria-live="polite"></p>
    </div>

    <script>
        // Official presale wallet (Ledger) — Robinhood Chain mainnet 4663
        var TRIBUTE_WALLET = '0x630014aA64DC97C53B1107AB8e8244260E8D02E3';

        var pledgeBtn = document.getElementById('pledge-btn');
        var walletHint = document.getElementById('wallet-hint');
        var copiedTimer = null;

        function showHint(text) {
            walletHint.textContent = text || '';
            walletHint.classList.add('is-visible');
        }

        function fallbackCopy(text) {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            var ok = false;
            try {
                ok = document.execCommand('copy');
            } catch (e) {
                ok = false;
            }
            document.body.removeChild(ta);
            return ok;
        }

        function copyTributeWallet() {
            if (!TRIBUTE_WALLET) return;

            function onSuccess() {
                pledgeBtn.classList.add('is-copied');
                showHint(TRIBUTE_WALLET);
                if (copiedTimer) window.clearTimeout(copiedTimer);
                copiedTimer = window.setTimeout(function () {
                    pledgeBtn.classList.remove('is-copied');
                }, 2000);
            }

            function onFail() {
                // Still reveal the address so the user can copy manually
                showHint(TRIBUTE_WALLET);
                pledgeBtn.classList.remove('is-copied');
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(TRIBUTE_WALLET).then(onSuccess).catch(function () {
                    fallbackCopy(TRIBUTE_WALLET) ? onSuccess() : onFail();
                });
            } else {
                fallbackCopy(TRIBUTE_WALLET) ? onSuccess() : onFail();
            }
        }

        pledgeBtn.addEventListener('click', copyTributeWallet);
    </script>
</body>
</html>
