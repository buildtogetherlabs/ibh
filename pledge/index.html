<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Open Graph / social link previews -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://local4663.com/pledge/">
    <meta property="og:title" content="Send Pledge — Local 4663">

    <meta property="og:image" content="https://local4663.com/IBHlinkimage.png">

    <meta property="og:image:height" content="1024">
    <meta property="og:image:alt" content="International Brotherhood of Hoodsters — Local 4663">
    <meta property="og:site_name" content="Local 4663">

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@local4663">
    <meta name="twitter:title" content="Send Pledge — Local 4663">
    <meta name="twitter:description" content="Send your pledge to Local 4663. International Brotherhood of Hoodsters.">
    <meta name="twitter:image" content="https://local4663.com/IBHlinkimage.png">
    <meta name="twitter:image:alt" content="International Brotherhood of Hoodsters — Local 4663">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap');

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            min-height: 100vh;
        }

        body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Roboto Mono', monospace;
        }

        .back {
            position: fixed;
            top: 24px;
            left: 24px;
            color: #8b0000;
            font-size: 14px;
            text-decoration: none;
            opacity: 0.85;
            z-index: 2;
        }

        .back:hover {
            opacity: 1;
        }

        .panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: min(440px, 100%);
            width: 100%;
        }

        .member-card {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
            background: transparent;
            /* White PNG canvas multiplies to invisible on white page — no rectangular outline */
            mix-blend-mode: multiply;
        }

        .cta-row {
            display: flex;
            flex-wrap: wrap;
            align-items: stretch;
            justify-content: center;
            gap: 12px;
            margin-top: 24px;
            width: 100%;
            max-width: 440px;
        }

        button.cta,
        a.cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #8b0000;
            color: #d4af37;
            padding: 16px 20px;
            font-size: 16px;
            font-family: 'Roboto Mono', monospace;
            letter-spacing: 0.04em;
            border: none;
            cursor: pointer;
            transition: background 0.2s ease;
            flex: 1 1 160px;
            min-width: 0;
            text-align: center;
            text-decoration: none;
        }

        button.cta:hover,
        button.cta:focus-visible,
        a.cta:hover,
        a.cta:focus-visible {
            background: #a00000;
            outline: none;
        }

        button.cta .label-copied {
            display: none;
        }

        button.cta.is-copied .label-default {
            display: none;
        }

        button.cta.is-copied .label-copied {
            display: inline;
        }

        .after-copy {
            display: none;
            margin: 12px 0 0;
            max-width: 360px;
            width: 100%;
        }

        .after-copy.is-visible {
            display: block;
        }

        .wallet-hint {
            margin: 0;
            color: #5c4a2a;
            font-size: 12px;
            line-height: 1.4;
            text-align: center;
            word-break: break-all;
        }

        .rules {
            margin: 16px 0 0;
            color: #3d3428;
            font-size: 11px;
            line-height: 1.55;
            text-align: left;
        }

        .rules strong {
            color: #8b0000;
            font-weight: 700;
        }

        .rules ul {
            margin: 0;
            padding-left: 1.15em;
        }

        .rules li {
            margin: 0 0 8px;
        }

        .rules li:last-child {
            margin-bottom: 0;
        }

        a.x-link {
            position: fixed;
            right: 24px;
            bottom: 24px;
            font-family: 'Roboto Mono', monospace;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: #8b0000;
            text-decoration: none;
            line-height: 1;
            z-index: 2;
            transition: color 0.2s ease;
        }

        a.x-link:hover,
        a.x-link:focus-visible {
            color: #a00000;
            outline: none;
        }
    </style>
</head>
<body>
    <a class="back" href="/">← LOCAL 4663</a>

    <div class="panel">
        <img
            src="IBHmembercard.png?v=multiply"
            class="member-card"
            alt="International Brotherhood of Hoodsters membership card"
        >

        <div class="cta-row">
            <button type="button" class="cta" id="pledge-btn" aria-label="Send Pledge — copy wallet address">
                <span class="label-default">SEND PLEDGE</span>
                <span class="label-copied">COPIED</span>
            </button>
            <a class="cta" href="/books/">ENTER UNION HALL</a>
        </div>

        <div class="after-copy" id="after-copy">
            <p class="wallet-hint" id="wallet-hint" aria-live="polite"></p>
            <div class="rules">
                <ul>
                    <li><strong>Network:</strong> Robinhood Chain only (chain id <strong>4663</strong>). Wrong chain = not credited.</li>
                    <li><strong>Send ETH</strong> to the address above (copy via Send Pledge).</li>
                    <li>Amounts over the per-wallet max may be refunded.</li>
                </ul>
            </div>
        </div>
    </div>

    <a
        class="x-link"
        href="https://x.com/local4663"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Local 4663 on X"
    >X</a>

    <script>
        // Official presale wallet (Ledger) — Robinhood Chain mainnet 4663
        var TRIBUTE_WALLET = '0x630014aA64DC97C53B1107AB8e8244260E8D02E3';

        var pledgeBtn = document.getElementById('pledge-btn');
        var afterCopy = document.getElementById('after-copy');
        var walletHint = document.getElementById('wallet-hint');
        var copiedTimer = null;

        function revealAfterCopy() {
            walletHint.textContent = TRIBUTE_WALLET;
            afterCopy.classList.add('is-visible');
        }

        function fallbackCopy(text) {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            var ok = false;
            try {
                ok = document.execCommand('copy');
            } catch (e) {
                ok = false;
            }
            document.body.removeChild(ta);
            return ok;
        }

        function copyTributeWallet() {
            if (!TRIBUTE_WALLET) return;

            function onSuccess() {
                pledgeBtn.classList.add('is-copied');
                revealAfterCopy();
                if (copiedTimer) window.clearTimeout(copiedTimer);
                copiedTimer = window.setTimeout(function () {
                    pledgeBtn.classList.remove('is-copied');
                }, 2000);
            }

            function onFail() {
                revealAfterCopy();
                pledgeBtn.classList.remove('is-copied');
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(TRIBUTE_WALLET).then(onSuccess).catch(function () {
                    fallbackCopy(TRIBUTE_WALLET) ? onSuccess() : onFail();
                });
            } else {
                fallbackCopy(TRIBUTE_WALLET) ? onSuccess() : onFail();
            }
        }

        pledgeBtn.addEventListener('click', copyTributeWallet);
    </script>
</body>
</html>
